<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Opener</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="description" content="I advise enterprises and messaging platforms on AI-assisted and programmatic localisation, template, and content management, from strategy and business analysis through product design and development." />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://opener.se/" />
    <meta property="og:title" content="Opener: Deepen the brand-customer bond with AI-assisted messaging architecture" />
    <meta property="og:description" content="I advise enterprises and messaging platforms on AI-assisted and programmatic localisation, template, and content management, from strategy and business analysis through product design and development." />
    <meta property="og:image" content="https://opener.se/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Opener: Deepen the brand-customer bond with AI-assisted messaging architecture" />
    <meta name="twitter:description" content="I advise enterprises and messaging platforms on AI-assisted and programmatic localisation, template, and content management, from strategy and business analysis through product design and development." />
    <meta name="twitter:image" content="https://opener.se/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Opener",
        "url": "https://opener.se",
        "description": "I advise enterprises and messaging platforms on AI-assisted and programmatic localisation, template, and content management, from strategy and business analysis through product design and development.",
        "founder": {
          "@type": "Person",
          "name": "Viktor Edvardsson"
        },
        "serviceType": ["Strategy", "Business Analysis", "Product Design", "AI-Assisted Development", "Localisation and Content Management Consultancy"]
      }
    </script>

    <style>
      @font-face {
        font-family: "Uncut Sans";
        src: url("fonts/UncutSans-Variable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
      }

      a {
        color: inherit;
        text-decoration: none;
        padding-bottom: 2px;
        border-bottom: 3px solid #000;
      }

      body {
        font-family: "Uncut Sans", sans-serif;
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        color: #000;
        background-color: #fff;
      }

      header {
        position: fixed;
        top: 24px;
        left: 24px;
        font-size: 20px;
      }

      p {
        width: 61.8vw;
        margin: 0 auto;
        font-size: 35px;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }

      @media (max-width: 1200px) {
        p {
          width: 75vw;
          font-size: 18px;
        }
      }

      @media (max-width: 768px) {
        p {
          width: auto;
          margin: 0 24px;
          font-size: 17px;
        }
      }

      #cycle {
        display: inline-block;
        opacity: 1;
        transition: opacity 0.4s ease;
      }

      #cycle.fade {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <header>Opener</header>
    <p>
      I advise agencies, enterprises, and vendors on how to move into and inside the new landscape of <span id="cycle">transactional</span> messaging.
      <br />
      <br />
      Ping me on <a href="https://www.linkedin.com/in/viktoredvardsson/">LinkedIn</a> or send me an email at <a href="mailto:viktor@opener.se">viktor@opener.se</a>.
    </p>
    <script>
      const words = ["transactional", "service", "utility", "proactive", "last mile"];
      const el = document.getElementById("cycle");
      let i = 0;
      setInterval(() => {
        el.classList.add("fade");
        setTimeout(() => {
          i = (i + 1) % words.length;
          el.textContent = words[i];
          el.classList.remove("fade");
        }, 400);
      }, 2500);
    </script>
  </body>
</html>
